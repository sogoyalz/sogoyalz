name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-build
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit profile updates
        run: |
          git add dark_mode.svg light_mode.svg cache/*.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.email "github-actions-bot@sogoyalz.github.io"
          git config user.name "sogoyalz/GitHub-Actions-Bot"
          git commit -m "Updated README"
          git push
